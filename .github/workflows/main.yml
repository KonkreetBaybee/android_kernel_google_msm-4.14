name: Build Floral/Coral Kernel (Clang)

on:
  workflow_dispatch:
    inputs:
      clang_ver:
        description: "Ubuntu clang version (e.g., 17, 18)"
        required: false
        default: "17"
      jobs:
        description: "make -j jobs (default: nproc)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      SUBARCH: arm64
      # Cross triples (used when LLVM=1 calls llvm- prefixed tools; we still install binutils for some scripts)
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      LLVM: "1"
      LLVM_IAS: "1"
      # Let ccache wrap clang & clang++
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: "8G"
      O: out

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps (clang, binutils, build tools)
        run: |
          sudo apt-get -yq update
          sudo apt-get -yq install \
            clang-${{ inputs.clang_ver }} lld-${{ inputs.clang_ver }} llvm-${{ inputs.clang_ver }} \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            bc bison flex libssl-dev libelf-dev dwarves ccache make git python3

          # Symlink generic clang/lld to requested version for convenience
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${{ inputs.clang_ver }} 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${{ inputs.clang_ver }} 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-${{ inputs.clang_ver }} 100
          echo "clang: $(clang --version | head -n1)"

      - name: Prime ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-clang${{ inputs.clang_ver }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-clang${{ inputs.clang_ver }}-
            ccache-${{ runner.os }}-

      - name: Show floral build configs present
        run: |
          echo "== build.config files =="
          ls -1 build.config.floral* || true
          echo "== helper scripts =="
          ls -1 build_floral.sh || true

      - name: Configure (auto-detect floral defconfig)
        run: |
          set -xe
          mkdir -p "${O}"

          # Try to find a floral defconfig (typical name is 'floral_defconfig')
          DEFCONFIG="$(ls arch/arm64/configs/*floral*_defconfig 2>/dev/null | xargs -r -n1 basename | head -n1 || true)"
          if [ -z "${DEFCONFIG}" ]; then
            DEFCONFIG="floral_defconfig"
            echo "No *floral*_defconfig found; falling back to ${DEFCONFIG}"
          else
            echo "Detected defconfig: ${DEFCONFIG}"
          fi

          # Use ccache by prepending CC="ccache clang"
          make -C . O="${O}" ARCH=${ARCH} CC="ccache clang" ${DEFCONFIG}

      - name: Build kernel (Image.gz-dtb, dtbs, modules)
        env:
          # Allow caller to override -j, else use nproc
          MAKEJ: ${{ inputs.jobs }}
        run: |
          set -xe
          J=${MAKEJ:-"$(nproc)"}
          echo "Using -j${J}"
          # Common flags for LLVM build
          export KCFLAGS="-Wno-error"
          make -C . O="${O}" ARCH=${ARCH} CC="ccache clang" \
               LLVM=${LLVM} LLVM_IAS=${LLVM_IAS} \
               CROSS_COMPILE=${CROSS_COMPILE} \
               CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32} \
               -j"${J}"

          # Useful outputs:
          ls -lh "${O}/arch/arm64/boot/" || true
          ls -lh "${O}/arch/arm64/boot/dts" || true
          [ -f "${O}/arch/arm64/boot/Image.gz-dtb" ] || (echo "Image.gz-dtb missing" && exit 2)

      - name: Package artifacts
        run: |
          set -xe
          mkdir -p dist
          cp -av "${O}/.config" dist/kernel.config
          cp -av "${O}/arch/arm64/boot/Image.gz-dtb" dist/ || true
          # dtbs
          (tar -C "${O}/arch/arm64/boot/dts" -acf dist/dtbs.tar.zst .) || true
          # modules (if any built as M)
          (make -C . O="${O}" ARCH=${ARCH} modules_install INSTALL_MOD_PATH="${PWD}/_mods") || true
          (cd _mods && tar -acf ../dist/modules.tar.zst .) || true
          echo "Dist contents:"
          ls -lh dist || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: floral-kernel-clang${{ inputs.clang_ver }}
          path: dist/
          if-no-files-found: error
